<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | TicketVibe</title>
     <link rel="stylesheet" href="/styles/style.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar scrolled" id="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html" style="display:flex; align-items:center; gap:0.5rem;">
                    <i class="fa-solid fa-ticket"></i>
                    <span>TicketVibe</span>
                </a>
            </div>
            <nav class="nav-links">
                <a href="eventos.html">Eventos</a>
                <a href="shows.html">Shows</a>
                <a href="destaques.html">Destaques</a>
                <a href="artistas.html">Artistas</a>
                <a href="turnes.html">Turnês</a>
            </nav>
            <div class="nav-actions">
                <a href="login.html" class="btn-login">Login</a>
                <a href="cadastro.html" class="btn-cadastro" style="box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);">Cadastro</a>
            </div>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-container">
            <h2>Crie sua conta</h2>
            <p>É rápido e fácil. Acesso aos melhores eventos!</p>

            <form class="auth-form" action="index.html">
                <div class="form-group">
                    <label for="name">Nome Completo</label>
                    <input type="text" id="name" placeholder="João da Silva" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Mínimo de 8 caracteres" required>
                </div>

                <button type="submit" class="btn-submit">Criar Conta</button>
            </form>

            <div class="auth-links">
                Já tem uma conta? <a href="login.html">Faça login</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
