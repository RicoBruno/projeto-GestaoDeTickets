<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TicketVibe</title>
     <link rel="stylesheet" href="/styles/style.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar scrolled" id="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html" style="display:flex; align-items:center; gap:0.5rem;">
                    <i class="fa-solid fa-ticket"></i>
                    <span>TicketVibe</span>
                </a>
            </div>
            <nav class="nav-links">
                <a href="eventos.html">Eventos</a>
                <a href="shows.html">Shows</a>
                <a href="destaques.html">Destaques</a>
                <a href="artistas.html">Artistas</a>
                <a href="turnes.html">Turnês</a>
            </nav>
            <div class="nav-actions">
                <a href="login.html" class="btn-login" style="color:var(--secondary)">Login</a>
                <a href="cadastro.html" class="btn-cadastro">Cadastro</a>
            </div>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-container">
            <h2>Bem-vindo de volta!</h2>
            <p>Faça login para acessar seus ingressos.</p>

            <form class="auth-form" action="index.html">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Sua senha" required>
                </div>
                
                <div style="display:flex; justify-content:flex-end;">
                    <a href="#" style="font-size:0.85rem; color:var(--text-muted); text-decoration:underline;">Esqueci minha senha</a>
                </div>

                <button type="submit" class="btn-submit">Entrar</button>
            </form>

            <div class="auth-links">
                Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
