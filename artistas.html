<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artistas | TicketVibe</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar scrolled" id="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html" style="display:flex; align-items:center; gap:0.5rem;">
                    <i class="fa-solid fa-ticket"></i>
                    <span>TicketVibe</span>
                </a>
            </div>
            <nav class="nav-links">
                <a href="eventos.html">Eventos</a>
                <a href="shows.html">Shows</a>
                <a href="destaques.html">Destaques</a>
                <a href="artistas.html" style="color:var(--text-main);">Artistas</a>
                <a href="turnes.html">Turnês</a>
            </nav>
            <div class="nav-actions">
                <a href="login.html" class="btn-login">Login</a>
                <a href="cadastro.html" class="btn-cadastro">Cadastro</a>
            </div>
            <div class="mobile-menu-btn"><i class="fa-solid fa-bars"></i></div>
        </div>
    </header>

    <section class="page-header">
        <h1>Nossos <span class="gradient-text">Artistas</span></h1>
        <p>Acompanhe os seus artistas favoritos e saiba quando eles tocarão na sua cidade.</p>
    </section>

    <section class="page-content cards-grid">
        <div class="event-card">
            <div class="card-img" style="height:300px;">
                <img src="https://images.unsplash.com/photo-1493225457124-a1a2a5f1e164?q=80&w=800&auto=format&fit=crop" alt="Banda Rock">
            </div>
            <div class="card-content" style="text-align:center;">
                <h3>The Midnight Band</h3>
                <p style="color:var(--text-muted); font-size: 0.9rem;">Indie / Rock</p>
                <button class="btn-buy" style="margin-top:1rem; width:100%;">Seguir Artista</button>
            </div>
        </div>
        
        <div class="event-card">
            <div class="card-img" style="height:300px;">
                <img src="https://images.unsplash.com/photo-1516280440503-6c7c0062a4f6?q=80&w=800&auto=format&fit=crop" alt="Cantora Pop">
            </div>
            <div class="card-content" style="text-align:center;">
                <h3>Luna Eclipse</h3>
                <p style="color:var(--text-muted); font-size: 0.9rem;">Pop / Dance</p>
                <button class="btn-buy" style="margin-top:1rem; width:100%;">Seguir Artista</button>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
